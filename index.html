<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desi Motion - Viral & Trending Entertainment</title>

<body class="bg-gray-900 text-gray-100 font-sans pb-20 min-h-screen">

    <!-- Header -->

    <!-- Content Container -->
    <main class="container mx-auto px-4 max-w-5xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Video Card 1 -->
            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-md">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500" class="w-full h-48 object-cover" alt="Movie Clip">
                <div class="p-4">
                    <h2 class="text-sm font-bold text-white mb-1">Top Action Scene Highlights</h2>
                    <p class="text-xs text-gray-400">Duration: 02:45 mins</p>
                </div>
            </div>

            <!-- Video Card 2 -->
            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-md">
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500" class="w-full h-48 object-cover" alt="Cinema">
                <div class="p-4">
                    <h2 class="text-sm font-bold text-white mb-1">Upcoming Movie Teasers</h2>
                    <p class="text-xs text-gray-400">Duration: 01:30 mins</p>
                </div>
            </div>

            <!-- Video Card 3 -->
            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-md">
                <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=500" class="w-full h-48 object-cover" alt="Entertainment">
                <div class="p-4">
                    <h2 class="text-sm font-bold text-white mb-1">Funny Viral Shorts Collection</h2>
                    <p class="text-xs text-gray-400">Duration: 04:12 mins</p>
                </div>
            </div>

        </div>
    </main>

</body>
